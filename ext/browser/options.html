<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OpenDM 接管设置</title>
<style>
  :root {
    --bg: #0E1116; --surface: #151A21; --surface2: #1A212A;
    --border: #242C37; --text: #E6EDF3; --muted: #8A97A6; --accent: #4C8DFF;
    --green: #3FB950; --red: #F85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 48px;
    background: var(--bg); color: var(--text);
    font: 13px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 26px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px 22px; margin-bottom: 16px;
  }
  label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 7px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); font-size: 13px; font-family: inherit;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .row { display: flex; gap: 14px; }
  .row > div:first-child { width: 130px; flex: none; }
  .row > div:last-child { flex: 1; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  button {
    padding: 9px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    font-family: inherit;
  }
  button:hover { background: var(--surface2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: #5C99FF; }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .track {
    width: 40px; height: 22px; border-radius: 11px; background: var(--surface2);
    border: 1px solid var(--border); position: relative; transition: background .15s;
  }
  .track::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s;
  }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(18px); background: #fff; }
  #status { font-size: 12.5px; }
  .ok { color: var(--green); }
  .bad { color: var(--red); }
  code {
    background: var(--surface2); padding: 1px 5px; border-radius: 4px;
    font-family: Consolas, monospace; font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>OpenDM 接管设置</h1>
  <div class="sub">把下面两项填成 OpenDM「设置 → 浏览器接管」里显示的值。</div>

  <div class="card">
    <div class="row">
      <div>
        <label for="port">端口</label>
        <input id="port" type="number" min="1024" max="65535" placeholder="65200">
      </div>
      <div>
        <label for="token">令牌</label>
        <input id="token" type="text" placeholder="16 位十六进制串" spellcheck="false">
      </div>
    </div>
    <div class="hint">令牌是防止任意网页往你下载队列里塞文件的，别外传。</div>
  </div>

  <div class="card">
    <label class="switch">
      <input id="enabled" type="checkbox">
      <span class="track"></span>
      <span>开启接管（浏览器发起的下载自动转给 OpenDM）</span>
    </label>
    <div class="hint">
      关闭后浏览器恢复自己下载。无论如何，连不上 OpenDM 时扩展都会静默放行，不会拦着你的下载。
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="save">保存</button>
    <button id="test">测试连接</button>
    <span id="status"></span>
  </div>

  <div class="hint" style="margin-top:22px">
    提示：也可以右键链接或视频选择「用 OpenDM 下载」，那条路径不看这里的开关，只看令牌。
    地址形如 <code>http://127.0.0.1:65200/ping</code>。
  </div>
</div>

<script src="options.js"></script>
</body>
</html>
